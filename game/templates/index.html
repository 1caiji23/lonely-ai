<!DOCTYPE html>
<html>
<head>
    <title>Gamified Experience</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div id="game-container">
        <div id="background"></div>
        <div id="character"></div>
        <div id="seat"></div>
        <div id="dialog-container">
            <div id="dialog-box">
                <p id="message"></p>
            </div>
        </div>
        <div id="input-container">
            <input type="text" id="ai-message-input" placeholder="Say something to the girl...">
            <button id="ai-message-btn">Send</button>
        </div>
    </div>

    <div id="achievements">
        <h2>Achievements</h2>
        <ul id="achievement-list"></ul>
    </div>

    <script>
        document.getElementById('ai-message-btn').addEventListener('click', () => {
            const message = document.getElementById('ai-message-input').value;
            fetch('/ask', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                const dialogBox = document.getElementById('dialog-box');
                const newMessage = document.createElement('p');
                newMessage.innerText = data.response;
                dialogBox.appendChild(newMessage);
                dialogBox.scrollTop = dialogBox.scrollHeight;
                const audio = new Audio(data.audio);
                audio.play();
            });
        });
    </script>
</body>
</html>
